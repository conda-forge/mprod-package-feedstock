{% set name = "mprod-package" %}
{% set version = "0.0.6" %}
{% set sha256 = "f2d26612acedd9a1090fb37b0295af7f1eb7f8f2e97e2117790ba3f9d5b70e64" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace("-", "_") }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --ignore-installed . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - numpy >=1.19.2
    - pandas >=1.1.5
    - python >={{ python_min }}
    - scikit-learn >=0.24.1
    - scipy >=1.5.3

test:
  imports:
    - mprod
    - mprod.decompositions
    - mprod.dimensionality_reduction
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/UriaMorP/mprod_package
  summary: Software implementation for tensor-tensor m-product framework
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  description: |
    The mprod package provides python implementation for applying tensor-tensor (tubal) products.
    In addition, tensor decompositions such as tQRM and tSVDM are provided, together
    with tools for conducting multi-way data analysis such as TCAM. 

extra:
  recipe-maintainers:
    - UriaMorP
